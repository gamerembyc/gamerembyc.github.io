<body>
  <script>
    fetch("https://ipapi.co/json/")
      .then(response => response.json())
      .then(data => {
        if (data.country_code === "PL") {
          // Polska
          window.location.replace(
            "https://contrack.link/p/681c914b20a18739e57686b4/6870e90b33c20769ad01d726"
          );
        } else {
          // Poza Polską
          window.location.replace(
            "https://radarkobiet.pl/link/83cc/281/17458859"
          );
        }
      })
      .catch(() => {
        // Jeśli API nie odpowie — domyślnie kieruj na wersję PL
        window.location.replace(
          "https://radarkobiet.pl/link/83cc/281/17458859"
        );
      });
  </script>
